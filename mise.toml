# Starisk — dev coordinator
#
# Two toolchains, one repo: Python in `pipeline/` (the back), Node in `web/`
# (the front), joined by `pipeline/data/scores.json`.
#
# mise is for humans. It is NOT a build dependency: `build.sh` stays the deploy
# entry point, so CI and the static host need only node + python, never mise.

[tools]
node = "24"
python = "3.13"
ruff = "latest"

[tasks.setup]
description = "Install the front-end dependencies"
run = "npm ci --prefix web"

[tasks."pipeline:test"]
description = "Run the Python pipeline tests"
dir = "pipeline"
run = "python -m unittest discover -s tests"

[tasks."pipeline:lint"]
description = "Lint the Python pipeline"
dir = "pipeline"
run = "ruff check ."

[tasks."pipeline:cache"]
description = "Inspect the page cache: counts and sizes, or a full reparse"
dir = "pipeline"
run = "python -m starisk.cache"

[tasks."pipeline:crawl"]
description = "Crawl the courses listed in pipeline/data/sources.json, then localise logos"
dir = "pipeline"
# The shebang matters: without it mise appends `mise run ... -- --limit 10` to
# the last line, which feeds the flags to `groupings`. With it, mise executes
# the script with the arguments as `"$@"`, so only the crawl sees them.
run = """
#!/bin/sh
set -e
python -m starisk.crawl "$@"
python -m starisk.logos
python -m starisk.logo_hires
# --fetch only pays for pages missing from this machine's cache, so a fresh
# checkout rebuilds the index instead of refusing to shrink it. Exit 2 is a
# rate-limited fetch: the index on disk is still valid, so the chain carries on.
python -m starisk.groupings --fetch --write || [ $? -eq 2 ]
"""

[tasks."pipeline:all"]
description = "One full run: queue, discover, expand, crawl, localise, rebuild, sync"
dir = "pipeline"
# Composed rather than copied, so the order and the derived steps live in one
# place. Discovery comes before expansion because `expand --programs` reads the
# groupings.json that discovery rewrites; this is the nightly's order too.
# Specializations are excluded: they re-read my completed certificates to find
# members already queued, so that lever is run by hand when a cert is added.
# groupings.json is derived from the page cache, so a full run you intend to
# commit belongs where that cache lives (the crawl box), not a partial laptop one.
# The shebang keeps `-- --limit 20` flowing to `pipeline:crawl`.
run = """
#!/bin/sh
set -e
# The queue is an input, not a prerequisite: an unreachable database must not
# stop a run that already has sources. STARISK_ENV_FILE picks the database.
mise run pipeline:demand -- --env-file "${STARISK_ENV_FILE:-.env.prod}" --write \\
  || echo "[all] the queue read failed; crawling the sources we already have"
mise run pipeline:discover
mise run pipeline:expand -- --write --programs --instructors
mise run pipeline:crawl -- "$@"
mise run web:sync
"""

[tasks."pipeline:add"]
description = "Add a course by URL or slug to data/sources.json"
dir = "pipeline"
run = "python -m starisk.add"

[tasks."pipeline:demand"]
description = "Turn the Turso request inbox into crawl work and data/requests.json (dry run; --write to apply)"
dir = "pipeline"
run = "python -m starisk.demand"


[tasks."pipeline:expand"]
description = "Grow sources.json from specializations and instructor profiles"
dir = "pipeline"
run = "python -m starisk.expand"

[tasks."pipeline:smoke"]
description = "Live adapter and site checks; non-zero when Coursera stopped parsing"
dir = "pipeline"
run = "python -m starisk.smoke"

[tasks."pipeline:nightly"]
description = "One unattended run; try it with `-- --dry-run` (see ops/README.md)"
dir = "pipeline"
run = "python -m starisk.nightly"

[tasks."pipeline:logos"]
description = "Localise provider logos, then derive the tile/full marks"
dir = "pipeline"
run = """
python -m starisk.logos
python -m starisk.logo_hires
"""

[tasks."pipeline:groupings"]
description = "Rebuild data/groupings.json from cached program pages"
dir = "pipeline"
run = "python -m starisk.groupings --write"

[tasks."pipeline:discover"]
description = "Discover the next programs from the sitemap, fetch their pages, rebuild the index"
dir = "pipeline"
run = "python -m starisk.groupings --discover --refresh --fetch --write"

[tasks."pipeline:seed-programs"]
description = "Fetch seeded program pages, then rebuild data/groupings.json"
dir = "pipeline"
run = "python -m starisk.groupings --fetch --write"

[tasks."pipeline:calibration"]
description = "Compare my labels with the model (Spearman); --label to add labels"
dir = "pipeline"
run = "python -m starisk.calibration"

[tasks."pipeline:score"]
description = "Score local review snapshots in samples/live"
dir = "pipeline"
run = "python score.py ../samples/live/*.html"

[tasks."web:dev"]
description = "Run the Astro dev server (localhost:4321)"
dir = "web"
run = "npm run dev"

[tasks."web:build"]
description = "Build the site from the current data copy"
dir = "web"
run = "npm run build"

[tasks."web:sync"]
description = "Copy pipeline data into the site without a full build"
run = "node web/scripts/sync-data.mjs"

[tasks."web:dev:api"]
description = "Dev server with the /api function (vercel dev; needs web/.env.local)"
dir = "web"
run = "npx --yes vercel dev"

[tasks."site:build"]
description = "Copy fresh scores from the pipeline, then build the site"
run = "./build.sh"

[tasks.check]
description = "Lint and test the pipeline, then build the site"
depends = ["pipeline:lint", "pipeline:test", "site:build"]

[tasks."pr:release"]
description = "Open the develop → main release PR with today's title"
# The title is the only thing that changes run to run, so it is generated. The
# body is left empty; the template in `.github/` is for PRs opened from the web.
run = 'gh pr create --base main --head develop --title "release: merge develop into main ($(date +%F))" --body ""'

# --- the box -------------------------------------------------------------
#
# The nightly container, where it actually lives. These need root (the Docker
# socket) and an env file; STARISK_ENV_FILE overrides the default. Extra
# arguments are appended: `mise run ops:rehearse -- --limit 20`.

[tasks."ops:build"]
description = "Build the nightly image"
run = "sudo docker build -f ops/Dockerfile -t starisk-nightly ."

[tasks."ops:stats"]
description = "What the state volume holds"
run = """
sudo docker run --rm -v starisk-state:/state --entrypoint sh starisk-nightly \
  -c 'du -sh /state; ls -la /state; ls /state/cache/pages 2>/dev/null | wc -l'
"""

[tasks."ops:dry"]
description = "Config and live checks; writes nothing, crawls nothing"
run = "sudo docker run --rm --init --env-file ${STARISK_ENV_FILE:-/etc/starisk/env} -v starisk-state:/state starisk-nightly --dry-run"

[tasks."ops:rehearse"]
description = "Crawl for real, publish nothing (append -- --limit 20)"
run = "sudo docker run --rm --init --env-file ${STARISK_ENV_FILE:-/etc/starisk/env} -v starisk-state:/state starisk-nightly --no-git"

[tasks."ops:run"]
description = "The real run: commit, push, pull request"
run = "sudo docker run --rm --init --env-file ${STARISK_ENV_FILE:-/etc/starisk/env} -v starisk-state:/state starisk-nightly"

[tasks."ops:last"]
description = "The last run's record"
run = "sudo docker run --rm -v starisk-state:/state --entrypoint cat starisk-nightly /state/logs/last-run.json"

[tasks."ops:log"]
description = "The last day of journal entries"
run = "sudo journalctl -t starisk-nightly --since -24h --no-pager"
