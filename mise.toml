[tools]
node = "24"
python = "3.13"

[tasks.install]
description = "Install extension dependencies"
run = "npm install"

[tasks.build]
description = "Build the extension into distribution/"
run = "npm run build"

[tasks.watch]
description = "Rebuild the extension on file changes"
run = "npm run watch"

[tasks.lint]
description = "Lint JavaScript and CSS"
run = "npm run lint"

[tasks.test]
description = "Run unit and end-to-end tests"
run = "npm test"

[tasks."test:unit"]
description = "Run unit tests"
run = "npm run test:unit"

[tasks."test:e2e"]
description = "Run end-to-end tests (requires a prior build)"
run = "npm run test:e2e"

[tasks."engine:test"]
description = "Run the JavaScript engine tests with Node's test runner"
run = "node --test engine/*.test.js"

[tasks."pipeline:test"]
description = "Run the Python pipeline tests"
dir = "pipeline"
run = "python -m unittest discover -s tests"

[tasks."pipeline:crawl"]
description = "Crawl the courses listed in pipeline/data/sources.json"
dir = "pipeline"
run = "python -m stellaid.crawl"

[tasks."pipeline:score"]
description = "Score local review snapshots in samples/live"
dir = "pipeline"
run = "python score.py ../samples/live/*.html"

[tasks."web:install"]
description = "Install web dependencies"
dir = "web"
run = "npm install"

[tasks."web:dev"]
description = "Run the Astro dev server (localhost:4321)"
dir = "web"
run = "npm run dev"

[tasks."web:build"]
description = "Build the static site using the current data copy"
dir = "web"
run = "npm run build"

[tasks."site:build"]
description = "Copy fresh scores from the pipeline, then build the site"
run = "./build.sh"

[tasks.check]
description = "Run pipeline tests and build the site"
depends = ["pipeline:test", "site:build"]
