# Dependency updates for the parts that can drift.
#
# The pipeline is standard-library only, so there is nothing for a pip ecosystem
# to resolve; the site has eight runtime packages and the workflow pins a few
# actions. Those are what rot.

version: 2

updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # Routine bumps arrive as one PR. A major of a framework is a deliberate
      # upgrade, not something to merge because CI is green — see `ignore`.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: astro
        update-types: ["version-update:semver-major"]
      - dependency-name: svelte
        update-types: ["version-update:semver-major"]
      - dependency-name: "@astrojs/svelte"
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: daisyui
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
