# Run one nightly job and exit.
#
# The image carries the runtimes and the launcher; it carries no code and no
# state. Every run clones `develop` into the container's own filesystem, crawls,
# publishes a branch, and dies with the clone. What survives is `starisk-state`,
# mounted at /state and pointed at by STARISK_DATA.
#
#   ops/run.sh --dry-run
#   ops/run.sh --no-git --limit 1
#   ops/run.sh                      # the real run
#
# Reset the accumulated corpus (next run starts from an empty state):
#   docker volume rm starisk-state

services:
  nightly:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    image: starisk-nightly
    # Optional so a rehearsal can start with no secrets and fail with a clear
    # "missing config" message instead of a compose error.
    env_file:
      - path: .env
        required: false
    environment:
      STARISK_DATA: /state
      STARISK_LOGS: /state/logs
      # Branch under test: `STARISK_BRANCH=x ops/run.sh` runs the container
      # against an unmerged branch without merging anything.
      STARISK_BRANCH: ${STARISK_BRANCH:-develop}
    volumes:
      - starisk-state:/state
    init: true

volumes:
  starisk-state:
