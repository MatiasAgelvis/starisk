# The nightly crawl. The image holds no code: everything it runs is the clone
# mounted at /srv/starisk, including the entrypoint. So `build` is a one-time
# step (or one per runtime bump) and updating the job is `git pull`.
#
# Local rehearsal is the same command: run it from a scratch clone and point
# STARISK_REPO at it (defaults to the repo this file lives in).

services:
  nightly:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    image: starisk-nightly
    # Optional so a rehearsal can start with no secrets and fail with a clear
    # "missing config" message instead of a compose error.
    env_file:
      - path: .env
        required: false
    # The clone belongs to you; keep the files the run writes yours too.
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${STARISK_REPO:-..}:/srv/starisk
    working_dir: /srv/starisk
    entrypoint: ["/srv/starisk/ops/entrypoint.sh"]
    # No passwd entry for an arbitrary UID: give git and python a writable home.
    environment:
      HOME: /tmp
      GIT_AUTHOR_NAME: Starisk Bot
      GIT_AUTHOR_EMAIL: bot@matiasagelvis.com
      GIT_COMMITTER_NAME: Starisk Bot
      GIT_COMMITTER_EMAIL: bot@matiasagelvis.com
    init: true
