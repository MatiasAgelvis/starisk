# The nightly crawl.
#
# The clone lives in the `starisk` volume, owned by the container: the host has
# no checkout to switch, no cache to keep and no branch to clean up. The host
# provides this file, `ops/.env` and the cron line — nothing else.
#
# Reset the clone (it will be cloned again on the next run):
#   docker compose down -v

services:
  nightly:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    image: starisk-nightly
    # Optional so a rehearsal can start with no secrets and fail with a clear
    # "missing config" message instead of a compose error.
    env_file:
      - path: .env
        required: false
    volumes:
      - starisk:/srv/starisk
    working_dir: /srv/starisk
    init: true

volumes:
  starisk:
